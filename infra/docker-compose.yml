name: cgl-infra

# Local development only; production is infra/deploy.
services:
  # Postgres for the app — never point dev at production.
  app-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cgl
      POSTGRES_PASSWORD: cgl
      POSTGRES_DB: cgl
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Code execution sandbox (go-judge). Runs untrusted code, so it is only
  # ever published on localhost; the API and judge worker talk to it.
  judge:
    build: ./judge
    privileged: true
    shm_size: 256m
    ports:
      - "127.0.0.1:5050:5050"
    restart: unless-stopped

volumes:
  app-db-data:
