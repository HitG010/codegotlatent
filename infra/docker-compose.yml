name: cgl-infra

# Judge0's images are amd64-only; `platform` makes them run under Rosetta
# emulation on Apple Silicon. On an x86 GCP VM the line is a harmless no-op.
x-judge0: &judge0
  image: judge0/judge0:1.13.1
  platform: linux/amd64
  volumes:
    - ./judge0.conf:/judge0.conf:ro
  privileged: true
  restart: unless-stopped

services:
  # Redis used by the CodeGotLatent backend itself (rate limiting).
  # Separate from Judge0's internal Redis so the two never fight.
  app-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - app-redis-data:/data
    restart: unless-stopped

  # ---- Judge0 code execution engine (mirrors the official v1.13.1 deployment) ----
  server:
    <<: *judge0
    ports:
      - "127.0.0.1:2358:2358"
    depends_on:
      - db
      - redis

  workers:
    <<: *judge0
    command: ["./scripts/workers"]
    depends_on:
      - db
      - redis

  # Judge0's own Postgres — internal only, no host port published,
  # so it can't collide with other Postgres instances on this machine.
  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - j0-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Judge0's own Redis (job queue) — internal only.
  redis:
    image: redis:7.2.4
    command: ["bash", "-c", "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    env_file: judge0.conf
    restart: unless-stopped

volumes:
  app-redis-data:
  j0-db-data:
